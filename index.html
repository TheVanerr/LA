<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1d1428">
  <meta name="description" content="Kral Maymun cumartesi planını çaldı! İki kedi, dört kat, bir date.">
  <title>Patili Rota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/pati.css">
</head>
<body>
<div id="app">
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Başlık -->
  <section id="scrTitle" class="screen">
    <div class="title-wrap">
      <p class="pre" id="titlePre"></p>
      <h1 class="logo"><span>PATİLİ</span><span>ROTA</span></h1>
      <p class="tag">Kral Maymun cumartesi planını çaldı! 🐒</p>
      <div class="invite-box hidden" id="inviteBox"></div>
      <div class="menu">
        <button class="px-btn primary" id="btnSolo">▶ OYNA</button>
        <button class="px-btn" id="btnCoop">♥ BERABER OYNA</button>
      </div>
      <div class="title-foot">
        <button class="icon-btn" id="btnSound" aria-label="Ses">🔊</button>
        <span>sesi aç, daha güzel 🎶</span>
      </div>
    </div>
  </section>

  <!-- Lobi -->
  <section id="scrLobby" class="screen hidden">
    <div class="panel">
      <h2>BERABER OYNA</h2>
      <p class="sub">Hangi kedisin?</p>
      <div class="cat-pick">
        <button class="cat-card" data-cat="eda"><img id="pickEda" alt=""><span id="pickEdaName"></span><small>tabby</small></button>
        <button class="cat-card" data-cat="sarman"><img id="pickSarman" alt=""><span id="pickSarmanName"></span><small>sarman</small></button>
      </div>
      <div class="lobby-actions" id="lobbyStart">
        <button class="px-btn primary" id="btnCreate">ODA KUR</button>
        <span class="or">ya da kodla katıl</span>
        <div class="join-row">
          <input id="inCode" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Oda kodu">
          <button class="px-btn" id="btnJoin">KATIL</button>
        </div>
      </div>
      <div class="lobby-actions hidden" id="lobbyRoom">
        <p class="hint">Oda kodu</p>
        <div class="room-code" id="roomCode">----</div>
        <button class="px-btn small gold" id="btnShare">DAVET LİNKİNİ PAYLAŞ</button>
        <div class="slots"><div class="slot" id="slot0"></div><div class="slot" id="slot1"></div></div>
        <button class="px-btn primary" id="btnBegin">BAŞLA ▶</button>
        <p class="hint">Partnerin henüz gelmediyse kedisini yapay zekâ oynatır, istediği an katılabilir.</p>
      </div>
      <p class="err" id="lobbyErr" role="status"></p>
      <button class="px-btn ghost" id="btnBack">← geri</button>
    </div>
  </section>

  <!-- Oyun -->
  <section id="scrGame" class="screen hidden">
    <header id="hud">
      <div class="hud-p" id="hudP0"></div>
      <div class="hud-p right" id="hudP1"></div>
    </header>
    <div id="viewport">
      <canvas id="world"></canvas>
      <canvas id="mini"></canvas>
      <div class="chip" id="chip"></div>
      <div class="bossbar hidden" id="bossbar"><div>KRAL MAYMUN</div><div class="bar"><i id="bossHp"></i></div></div>
      <div class="banner" id="banner"></div>
      <div class="corner-btns">
        <button class="icon-btn" id="btnSound2" aria-label="Ses">🔊</button>
      </div>
      <div class="kbd-hint">ok tuşları / WASD: yürü · boşluk: MİYAV · E: öpücük 💋</div>
    </div>
    <div id="pad">
      <div class="dpad" id="dpad" aria-label="Yön tuşları">
        <span class="du">▲</span><span class="dl">◀</span><span class="dr">▶</span><span class="dd">▼</span>
      </div>
      <div class="act-btns">
        <button class="kiss-btn" id="btnKiss" aria-label="Öpücük"><span>💋</span><i class="cd" id="kissCd"></i></button>
        <button class="meow-btn" id="btnMeow" aria-label="Miyav"><span>MİYAV</span><i class="cd" id="meowCd"></i></button>
      </div>
    </div>
  </section>

  <!-- Final -->
  <section id="scrFinal" class="screen hidden"></section>

  <div id="overlay" class="overlay hidden"><div class="ov-box" id="ovBox"></div></div>
  <div id="toast" class="toast" role="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/tracking.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/sprites.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
