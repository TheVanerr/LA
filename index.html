<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round 2 — Eda 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/effects.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--gradient-evening);
    }

    body {
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    body.ready { opacity: 1; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      gap: 1.25rem;
      z-index: 1;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.65s linear;
      overflow-y: auto;
    }

    .screen:not(.hidden) { z-index: 2; }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.03);
    }

    .q-part {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
    }

    body.ready .q-part {
      animation: fade-in-up 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    body.ready .q-part-1 { animation-delay: 0.5s; }
    body.ready .q-part-2 { animation-delay: 1.35s; }
    body.ready .q-part-3 { animation-delay: 2.2s; }

    body.ready .intro-actions {
      animation: fade-in-up 0.85s ease forwards;
      animation-delay: 3.1s;
      opacity: 0;
    }

    .intro-actions { opacity: 0; }

    .recap-scroll {
      width: min(520px, 94vw);
      max-height: min(58vh, 480px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 0.25rem 0.5rem;
    }

    .recap-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
      text-align: left;
      opacity: 0;
      transform: translateX(-16px);
    }

    body.ready .recap-card {
      animation: timeline-in 0.7s ease forwards;
    }

    body.ready .recap-card:nth-child(1) { animation-delay: 0.3s; }
    body.ready .recap-card:nth-child(2) { animation-delay: 0.55s; }
    body.ready .recap-card:nth-child(3) { animation-delay: 0.8s; }
    body.ready .recap-card:nth-child(4) { animation-delay: 1.05s; }
    body.ready .recap-card:nth-child(5) { animation-delay: 1.3s; }

    .recap-card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .recap-card-emoji {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      background: rgba(255,255,255,0.6);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .recap-card h3 {
      font-family: var(--font-romantic);
      font-size: 1.35rem;
      color: var(--color-text-romantic);
      margin-bottom: 0.15rem;
    }

    .recap-card p {
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--color-text-soft);
    }

    .recap-meta {
      font-family: var(--font-handwriting);
      font-size: 1.5rem;
      color: var(--color-gold);
    }

    .date-pick-grid {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .date-pick {
      padding: 0.85rem 1.25rem;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.48);
      font-family: var(--font-romantic);
      font-size: 1.25rem;
      color: var(--color-text-romantic);
      cursor: pointer;
      transition: transform var(--transition-bounce), box-shadow var(--transition-smooth);
    }

    .date-pick:hover { transform: scale(1.05); box-shadow: var(--shadow-glow); }
    .date-pick.selected {
      border-color: var(--color-gold);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-glow);
    }

    .vibe-grid {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      width: min(480px, 94vw);
    }

    .vibe-pick {
      flex: 1 1 130px;
      padding: 1rem 0.75rem;
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.45);
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--color-text);
      transition: transform var(--transition-bounce), border-color var(--transition-smooth);
    }

    .vibe-pick span { display: block; font-size: 1.75rem; margin-bottom: 0.35rem; }
    .vibe-pick:hover { transform: translateY(-3px); }
    .vibe-pick.selected { border-color: var(--color-rose); background: rgba(255,255,255,0.72); }

    .confirm-note {
      font-family: var(--font-handwriting);
      font-size: 1.4rem;
      color: var(--color-rose-deep);
      min-height: 1.5em;
    }

    .final-meta {
      font-family: var(--font-romantic);
      font-size: 1.5rem;
      color: var(--color-text-romantic);
    }

    .confetti-piece {
      position: fixed;
      top: -10px;
      pointer-events: none;
      z-index: var(--z-particles);
      animation: drift-down linear forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .q-part, .intro-actions, .recap-card { opacity: 1; transform: none; animation: none !important; }
    }
  </style>
</head>
<body>

  <!-- 1: Kutlama -->
  <section class="screen bg-romantic" id="screenIntro">
    <span class="chapter-badge animate-fade-in-up">Chapter 2</span>
    <h1 class="text-romantic">
      <span class="q-part q-part-1"><em>Eda</em>,</span><br>
      <span class="q-part q-part-2">ilk date'imiz</span><br>
      <span class="q-part q-part-3"><em>muhteşemdi</em> ✨</span>
    </h1>
    <div class="intro-actions">
      <button class="btn-romantic btn-gold animate-pulse-glow" id="btnIntroContinue">Hatırlayalım mı? 💕</button>
    </div>
  </section>

  <!-- 2: İlk date özeti -->
  <section class="screen bg-recap hidden" id="screenRecap">
    <p class="subtitle">5 Eylül 2026 · hatırlıyor musun?</p>
    <h2 class="text-romantic">Bizim <em>ilk günümüz</em></h2>
    <div class="recap-scroll glass" id="recapTimeline"></div>
    <button class="btn-romantic btn-yes" id="btnRecapContinue">Devam 💕</button>
  </section>

  <!-- 3: 2. date teklifi -->
  <section class="screen bg-evening hidden" id="screenAsk">
    <h2 class="text-romantic">Peki… <em>Round 2?</em> 🌹</h2>
    <p class="text-handwriting" style="font-size: clamp(1.5rem, 4vw, 2rem);">Bir date daha yapalım mı?</p>
    <button class="btn-romantic btn-yes animate-pulse-glow" id="btnAskYes">Tabii ki! 💕</button>
  </section>

  <!-- 4: Tarih & vibe -->
  <section class="screen bg-evening hidden" id="screenPlan">
    <p class="subtitle">Planlama zamanı</p>
    <h2 class="text-romantic">Ne zaman <em>buluşalım?</em></h2>
    <div class="date-pick-grid" id="datePickGrid">
      <button type="button" class="date-pick" data-date="19.09.2026">19.09.2026</button>
      <button type="button" class="date-pick" data-date="26.09.2026">26.09.2026</button>
    </div>
    <p class="text-handwriting" style="font-size: 1.5rem; margin-top: 0.5rem;">Bu sefer nasıl bir gün?</p>
    <div class="vibe-grid" id="vibeGrid">
      <button type="button" class="vibe-pick" data-vibe="romantic"><span>🌹</span>Romantik</button>
      <button type="button" class="vibe-pick" data-vibe="fun"><span>🎡</span>Eğlenceli</button>
      <button type="button" class="vibe-pick" data-vibe="chill"><span>☕</span>Sakin</button>
    </div>
    <p class="confirm-note" id="planConfirmNote"></p>
    <button class="btn-romantic btn-yes" id="btnConfirmPlan" disabled>Planı onayla 💕</button>
  </section>

  <!-- 5: Final -->
  <section class="screen bg-romantic hidden" id="screenFinal">
    <h2 class="text-romantic">Round 2 <em>hazır</em> 💕</h2>
    <p class="final-meta" id="finalMeta"></p>
    <p class="text-handwriting" style="font-size: clamp(1.5rem, 4vw, 2rem);">Seni görmek için sabırsızlanıyorum Eda</p>
    <p class="text-body">Hazırsan yine ara beni 📞</p>
  </section>

  <div class="soft-rain" id="softRain"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/tracking.js"></script>
  <script>
    const DATE1 = {
      date: '05.09.2026',
      time: '12:00',
      stops: [
        { img: 'V1/assets/images/coffee.gif', title: 'Kahve & sohbet', note: 'Gün harika başladı ☕' },
        { img: 'V1/assets/images/sushi.gif', title: 'Akşam yemeği', note: 'Lezzetli bir seçim 🍽' },
        { img: 'V1/assets/images/walk.gif', title: 'Kanlıkavak', note: 'Birlikte yürüdük 🌳' },
        { img: 'V1/assets/images/alcohol.png', title: 'Fakülte Osmangazi', note: '2 bira, güzel sohbet 🍺' },
      ],
    };

    function saveResponse(fields) {
      try {
        if (window.LoveTrack) LoveTrack.track(fields);
      } catch (err) {
        console.warn('[save]', err);
      }
    }

    function goTo(from, to) {
      from.classList.add('hidden');
      to.classList.remove('hidden');
      to.scrollTop = 0;
    }

    function burstHearts(count = 40) {
      const items = ['💕', '💗', '✨', '🩷', '💛'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.textContent = items[Math.floor(Math.random() * items.length)];
        el.style.left = `${15 + Math.random() * 70}vw`;
        el.style.fontSize = `${0.9 + Math.random() * 1.1}rem`;
        el.style.animationDuration = `${2 + Math.random() * 2}s`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function startRain(container, n = 8) {
      const items = ['💕', '✨', '💛', '🩷'];
      for (let i = 0; i < n; i++) {
        const el = document.createElement('span');
        el.className = 'rain-particle';
        el.textContent = items[i % items.length];
        el.style.left = `${Math.random() * 100}%`;
        el.style.animationDuration = `${8 + Math.random() * 5}s`;
        el.style.animationDelay = `${Math.random() * 4}s`;
        el.style.fontSize = `${0.7 + Math.random() * 0.6}rem`;
        container.appendChild(el);
      }
    }

    function buildRecap() {
      const wrap = document.getElementById('recapTimeline');
      DATE1.stops.forEach((stop) => {
        const card = document.createElement('div');
        card.className = 'recap-card glass';
        const media = stop.img
          ? `<img src="${stop.img}" alt="${stop.title}" width="72" height="72" decoding="async">`
          : `<div class="recap-card-emoji">${stop.emoji || '💕'}</div>`;
        card.innerHTML = `${media}<div><h3>${stop.title}</h3><p>${stop.note}</p></div>`;
        wrap.appendChild(card);
      });
    }

    const screenIntro = document.getElementById('screenIntro');
    const screenRecap = document.getElementById('screenRecap');
    const screenAsk = document.getElementById('screenAsk');
    const screenPlan = document.getElementById('screenPlan');
    const screenFinal = document.getElementById('screenFinal');
    const btnIntroContinue = document.getElementById('btnIntroContinue');
    const btnRecapContinue = document.getElementById('btnRecapContinue');
    const btnAskYes = document.getElementById('btnAskYes');
    const btnConfirmPlan = document.getElementById('btnConfirmPlan');
    const planConfirmNote = document.getElementById('planConfirmNote');
    const finalMeta = document.getElementById('finalMeta');
    const datePicks = document.querySelectorAll('.date-pick');
    const vibePicks = document.querySelectorAll('.vibe-pick');

    let pickedDate = '';
    let pickedVibe = '';

    function revealPage() {
      if (document.body.classList.contains('ready')) return;
      document.body.classList.add('ready');
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => requestAnimationFrame(revealPage));
      setTimeout(revealPage, 1200);
    } else {
      requestAnimationFrame(revealPage);
    }

    startRain(document.getElementById('softRain'), 8);
    buildRecap();

    try { if (window.LoveTrack) LoveTrack.init(); } catch (_) {}

    btnIntroContinue.addEventListener('click', () => {
      burstHearts(35);
      saveResponse({ intro_seen: true });
      setTimeout(() => goTo(screenIntro, screenRecap), 600);
    });

    btnRecapContinue.addEventListener('click', () => {
      saveResponse({ recap_seen: true, date1: DATE1.date });
      burstHearts(25);
      setTimeout(() => goTo(screenRecap, screenAsk), 500);
    });

    btnAskYes.addEventListener('click', () => {
      btnAskYes.disabled = true;
      saveResponse({ said_yes_round2: true });
      burstHearts(50);
      setTimeout(() => goTo(screenAsk, screenPlan), 800);
    });

    datePicks.forEach((btn) => {
      btn.addEventListener('click', () => {
        pickedDate = btn.dataset.date;
        datePicks.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        checkPlanReady();
      });
    });

    vibePicks.forEach((btn) => {
      btn.addEventListener('click', () => {
        pickedVibe = btn.dataset.vibe;
        vibePicks.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        checkPlanReady();
      });
    });

    function checkPlanReady() {
      btnConfirmPlan.disabled = !(pickedDate && pickedVibe);
    }

    const vibeLabels = { romantic: 'Romantik', fun: 'Eğlenceli', chill: 'Sakin' };

    btnConfirmPlan.addEventListener('click', () => {
      if (!pickedDate || !pickedVibe) return;
      btnConfirmPlan.disabled = true;
      const vibeLabel = vibeLabels[pickedVibe] || pickedVibe;
      planConfirmNote.textContent = `${pickedDate} · ${vibeLabel} — harika! 💕`;
      finalMeta.textContent = `${pickedDate} · ${vibeLabel} bir gün`;
      saveResponse({
        picked_date: pickedDate,
        picked_vibe: pickedVibe,
        completed: true,
      });
      burstHearts(40);
      setTimeout(() => goTo(screenPlan, screenFinal), 1400);
    });
  </script>
</body>
</html>
